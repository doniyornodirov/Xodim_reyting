<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xodimlar ro'yxati</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;
            margin: 0;
        }
        .add-btn {
            background-color: #1e2636;
            color: #4caf50;
            border: 2px solid #4caf50;
            font-size: 20px;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .employee-card {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .info div {
            margin-bottom: 5px;
            font-size: 15px;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .edit-btn {
            background-color: #2a3447;
            color: #ffc107;
            border: 1px solid #ffc107;
            font-size: 16px;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn {
            background-color: #2a3447;
            color: #ff3b30;
            border: 1px solid #ff3b30;
            font-size: 16px;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Modal oyna dizayni */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e2636;
            padding: 22px;
            border-radius: 14px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: #2a3447;
            border: 1px solid #3f4d66;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background-color: #ff3b30; color: white; }
        .btn-no { background-color: #2a3447; color: #b0bec5; border: 1px solid #3f4d66; }
        .btn-save { background-color: #4caf50; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Xodimlar ro'yxati</h2>
            <button class="add-btn" onclick="openAddModal()">＋</button>
        </div>

        <div id="employeeList">
            Yuklanmoqda...
        </div>
    </div>

    <!-- Qo'shish / Tahrirlash Modali -->
    <div id="actionModal" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h3 id="modalTitle">Xodim qo'shish</h3>
            <input type="hidden" id="actionType">
            <label style="font-size: 14px; color: #b0bec5;">Telegram ID:</label>
            <input type="number" id="modalUserId" placeholder="Masalan: 854321054">
            <label style="font-size: 14px; color: #b0bec5;">Xodim ismi:</label>
            <input type="text" id="modalFullName" placeholder="Doniyoz z">
            <div class="modal-buttons">
                <button class="btn-no" onclick="closeModal()">Bekor qilish</button>
                <button class="btn-save" onclick="saveData()">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- O'chirishni Tasdiqlash Modali (Yes / No) -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Haqiqatda xodimni bo'shatmoqchimisiz?</h3>
            <input type="hidden" id="deleteUserId">
            <div class="modal-buttons">
                <button class="btn-no" onclick="closeDeleteModal()">No</button>
                <button class="btn-yes" onclick="confirmDelete()">Yes</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let employees = JSON.parse(localStorage.getItem('employees')) || [
            { id: "854321054", name: "Doniyoz z" },
            { id: "1079285432", name: "Samandar" }
        ];

        function renderList() {
            const listContainer = document.getElementById('employeeList');
            if (employees.length === 0) {
                listContainer.innerHTML = '<div class="employee-card">Hozircha xodimlar yo\'q.</div>';
                return;
            }

            let html = '';
            employees.forEach(emp => {
                html += `
                    <div class="employee-card" id="emp-card-${emp.id}">
                        <div class="info">
                            <div><b>Xodim:</b> ${emp.name}</div>
                            <div><b>ID:</b> ${emp.id}</div>
                        </div>
                        <div class="actions">
                            <button class="delete-btn" onclick="openDeleteModal('${emp.id}')" title="Bo'shatish">🗑️</button>
                            <button class="edit-btn" onclick="openEditModal('${emp.id}', '${emp.name}')" title="Tahrirlash">✏️</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Yangi xodim qo'shish";
            document.getElementById('actionType').value = "add";
            document.getElementById('modalUserId').value = "";
            document.getElementById('modalUserId').disabled = false;
            document.getElementById('modalFullName').value = "";
            document.getElementById('actionModal').style.display = "flex";
        }

        function openEditModal(id, name) {
            document.getElementById('modalTitle').innerText = "Xodimni tahrirlash";
            document.getElementById('actionType').value = "edit";
            document.getElementById('modalUserId').value = id;
            document.getElementById('modalUserId').disabled = true;
            document.getElementById('modalFullName').value = name;
            document.getElementById('actionModal').style.display = "flex";
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = "none";
        }

        function saveData() {
            const type = document.getElementById('actionType').value;
            const userId = document.getElementById('modalUserId').value;
            const fullName = document.getElementById('modalFullName').value;

            if (!userId || !fullName) {
                alert("Barcha maydonlarni to'ldiring!");
                return;
            }

            let existing = employees.find(e => e.id === userId);
            if (existing) {
                existing.name = fullName;
            } else {
                employees.push({ id: userId, name: fullName });
            }
            localStorage.setItem('employees', JSON.stringify(employees));
            renderList();
            closeModal();

            const data = {
                action: type === "add" ? "add_employee_webapp" : "edit_employee",
                user_id: userId,
                full_name: fullName
            };

            tg.sendData(JSON.stringify(data));
            setTimeout(() => {
                tg.close();
            }, 300);
        }

        function openDeleteModal(id) {
            document.getElementById('deleteUserId').value = id;
            document.getElementById('deleteModal').style.display = "flex";
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = "none";
        }

        function confirmDelete() {
            const id = document.getElementById('deleteUserId').value;
            
            // Sahifadan va xotiradan darhol o'chirish
            employees = employees.filter(emp => emp.id !== id);
            localStorage.setItem('employees', JSON.stringify(employees));

            closeDeleteModal();
