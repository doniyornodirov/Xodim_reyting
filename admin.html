<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahbar Paneli - Xodimlar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e2636;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #b0bec5;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #2a3447;
            border: 1px solid #3f4d66;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #43a047;
        }
        .info-box {
            background-color: #2a3447;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #90a4ae;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xodimni Tahrirlash</h2>
        <div class="info-box">
            💡 Botdagi <b>/xodimlar</b> buyrug'i orqali barcha xodimlarning ID raqamlari va ismlarini ko'rib olishingiz mumkin.
        </div>
        <form id="adminForm">
            <div class="form-group">
                <label for="userId">Xodimning Telegram ID raqami:</label>
                <input type="number" id="userId" placeholder="Masalan: 8662254493" required>
            </div>
            <div class="form-group">
                <label for="fullName">Yangi Ism va Familiyasi:</label>
                <input type="text" id="fullName" placeholder="Anvar Toshmatov" required>
            </div>
            <button type="submit">Ismini Yangilash</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userId = document.getElementById('userId').value;
            const fullName = document.getElementById('fullName').value;

            const data = {
                action: "edit_employee",
                user_id: userId,
                full_name: fullName
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
