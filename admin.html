<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Rahbar Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 15px; margin: 0; }
        h2, h3 { color: #333; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #0088cc; color: white; }
        input, button { padding: 8px; margin-top: 5px; font-size: 14px; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📊 Rahbar Boshqaruv Paneli</h2>

    <div class="card">
        <h3>💰 Bugungi Statistikalar</h3>
        <p><b>Bugungi umumiy to'lov:</b> <span id="todayTotal">0</span> so'm</p>
        <div id="cardBreakdown"></div>
    </div>

    <div class="card">
        <h3>👥 Xodimlar Ismini Tahrirlash</h3>
        <div id="employeeList">
            <!-- Xodimlar ro'yxati -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById("todayTotal").innerText = "1,500,000";
        
        function saveEmployeeName(userId) {
            const newName = document.getElementById(`name_${userId}`).value;
            const data = {
                action: "edit_employee",
                user_id: userId,
                full_name: newName
            };
            tg.sendData(JSON.stringify(data));
            alert("Xodim ismi saqlashga yuborildi!");
        }
    </script>
</body>
</html>
