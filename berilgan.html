<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berilgan Summa</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e2636;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 {
            margin-bottom: 5px;
            font-size: 22px;
            color: #ffffff;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #b0bec5;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #2a3447;
            border: 1px solid #3f4d66;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            border-color: #0088cc;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .info-text {
            font-size: 12px;
            color: #90a4ae;
            margin-top: 4px;
        }
        button {
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #43a047;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Berilgan Summa</h2>
        <form id="givenForm">
            <label for="amount">Berilgan summa (so'm):</label>
            <input type="text" id="amount" placeholder="1 000 000" required>
            <div id="amountWords" class="info-text"></div>

            <label for="comment">Izoh:</label>
            <textarea id="comment" placeholder="Izoh yozing..."></textarea>

            <button type="submit">Rahbarga yuborish</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('input', function (e) {
            let cleanVal = e.target.value.replace(/\D/g, '');
            if (cleanVal === '') {
                e.target.value = '';
                document.getElementById('amountWords').innerText = '';
                return;
            }
            let num = parseInt(cleanVal, 10);
            e.target.value = num.toLocaleString('en-US').replace(/,/g, ' ');
            document.getElementById('amountWords').innerText = "O'qilishi: " + numberToUzbekWords(num) + " so'm";
        });

        function numberToUzbekWords(num) {
            if (num === 0) return "nol";
            const birliklar = ["", "bir", "ikki", "uch", "to'rt", "besh", "olti", "yetti", "sakkiz", "to'qqiz"];
            const onliklar = ["", "o'n", "yigirma", "o'ttiz", "qirq", "ellik", "oltmish", "yetmish", "sakson", "to'qson"];
            const yuzliklar = ["", "bir yuz", "ikki yuz", "uch yuz", "to'rt yuz", "besh yuz", "olti yuz", "yetti yuz", "sakkiz yuz", "to'qqiz yuz"];
            
            function convertGroup(n) {
                let yuz = Math.floor(n / 100);
                let on = Math.floor((n % 100) / 10);
                let bir = n % 10;
                let res = "";
                if (yuz > 0) res += yuzliklar[yuz] + " ";
                if (on > 0) res += onliklar[on] + " ";
                if (bir > 0) res += birliklar[bir] + " ";
                return res.trim();
            }

            let darajalar = ["", "ming", "million", "milliard", "trillion"];
            let qismlar = [];
            let darajaIdx = 0;

            while (num > 0) {
                let qoldiq = num % 1000;
                if (qoldiq > 0) {
                    let str = convertGroup(qoldiq);
                    if (darajaIdx > 0) {
                        str += " " + darajalar[darajaIdx];
                    }
                    qismlar.unshift(str);
                }
                num = Math.floor(num / 1000);
                darajaIdx++;
            }
            return qismlar.join(" ");
        }

        document.getElementById('givenForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = document.getElementById('amount').value.replace(/\s/g, '');
            const comment = document.getElementById('comment').value;

            const data = {
                type: "given_amount",
                amount: amount,
                comment: comment
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
