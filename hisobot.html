<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Operators - Hisobot Topshirish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #211f1f;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .form-row label {
            font-size: 15px;
            color: #e5b352;
            font-weight: 500;
            flex: 1;
        }
        .form-row input {
            width: 55%;
            padding: 10px 12px;
            background-color: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
        }
        .form-row input[readonly] {
            background-color: #94a3b8;
            color: #0f172a;
            cursor: not-allowed;
        }
        .section-title {
            color: #ef4444;
            font-size: 15px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .total-box {
            background-color: #1e293b;
            border: 2px solid #22c55e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        .total-title {
            font-size: 13px;
            color: #94a3b8;
        }
        .total-amount {
            font-size: 20px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-submit:active {
            background-color: #006699;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="form-row">
            <label>Paynet *:</label>
            <input type="number" id="paynet" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>💳 Card (+3%):</label>
            <input type="number" id="card" value="0" readonly>
        </div>

        <div class="form-row">
            <label>💰 Leviy *:</label>
            <input type="number" id="leviy" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>🔌 SIMcard (dona) *:</label>
            <input type="number" id="simcard" value="0">
        </div>

        <div class="form-row">
            <label>💸 Qarzdorlik:</label>
            <input type="number" id="qarzdorlik" value="0" readonly>
        </div>

        <div class="form-row">
            <label>📻 Qarz uchun *:</label>
            <input type="number" id="qarz_uchun" value="0" oninput="calculateTotal()">
        </div>

        <div class="section-title">Minus:</div>

        <div class="form-row">
            <label>Terminal:</label>
            <input type="number" id="terminal" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>Berildi (Tasdiqlangan):</label>
            <input type="number" id="berildi" value="0" readonly>
        </div>

        <div class="form-row">
            <label>Kunlik:</label>
            <input type="number" id="kunlik" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>Skidka:</label>
            <input type="number" id="skidka" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>Xarajat:</label>
            <input type="number" id="xarajat" value="0" oninput="calculateTotal()">
        </div>

        <div class="form-row">
            <label>Comment:</label>
            <input type="text" id="comment" placeholder="Izoh yozishingiz mumkin">
        </div>

        <div class="total-box">
            <div class="total-title">Bugun topshiriladigan jami summa:</div>
            <div class="total-amount" id="totalDisplay">0 so'm</div>
        </div>

        <button class="btn-submit" onclick="sendReport()">So'rov yuborish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadParamsFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const debtParam = urlParams.get('debt');
            const givenParam = urlParams.get('given');
            const cardParam = urlParams.get('card');
            
            if (debtParam !== null && debtParam !== "") {
                document.getElementById('qarzdorlik').value = parseFloat(debtParam) || 0;
            } else {
                document.getElementById('qarzdorlik').value = 0;
            }

            if (givenParam !== null && givenParam !== "") {
                document.getElementById('berildi').value = parseFloat(givenParam) || 0;
            } else {
                document.getElementById('berildi').value = 0;
            }

            if (cardParam !== null && cardParam !== "") {
                document.getElementById('card').value = Math.round(parseFloat(cardParam) || 0);
            } else {
                document.getElementById('card').value = 0;
            }

            calculateTotal();
        }

        function calculateTotal() {
            let paynet = parseFloat(document.getElementById('paynet').value) || 0;
            let card = parseFloat(document.getElementById('card').value) || 0;
            let leviy = parseFloat(document.getElementById('leviy').value) || 0;
            let qarzdorlik = parseFloat(document.getElementById('qarzdorlik').value) || 0;
            let qarz_uchun = parseFloat(document.getElementById('qarz_uchun').value) || 0;

            let plusTotal = paynet + card + leviy + qarzdorlik + qarz_uchun;

            let terminal = parseFloat(document.getElementById('terminal').value) || 0;
            let berildi = parseFloat(document.getElementById('berildi').value) || 0;
            let kunlik = parseFloat(document.getElementById('kunlik').value) || 0;
            let skidka = parseFloat(document.getElementById('skidka').value) || 0;
            let xarajat = parseFloat(document.getElementById('xarajat').value) || 0;

            let minusTotal = terminal + berildi + kunlik + skidka + xarajat;

            let finalTotal = plusTotal - minusTotal;

            document.getElementById('totalDisplay').innerText = finalTotal.toLocaleString() + " so'm";
            return finalTotal;
        }

        function sendReport() {
            const paynetVal = document.getElementById('paynet').value.trim();
            const leviyVal = document.getElementById('leviy').value.trim();
            const simcardVal = document.getElementById('simcard').value.trim();
            const qarzUchunVal = document.getElementById('qarz_uchun').value.trim();

            const terminalVal = document.getElementById('terminal').value.trim();
            const kunlikVal = document.getElementById('kunlik').value.trim();
            const skidkaVal = document.getElementById('skidka').value.trim();
            const xarajatVal = document.getElementById('xarajat').value.trim();
            
            let commentVal = document.getElementById('comment').value.trim();
            if (!commentVal) {
                commentVal = "Izoh yo'q";
            }

            const debtTotal = parseFloat(document.getElementById('qarzdorlik').value) || 0;
            const qarzUchunNum = parseFloat(qarzUchunVal) || 0;

            if (paynetVal === "" || leviyVal === "" || simcardVal === "" || qarzUchunVal === "") {
                alert("⚠️ Paynet, Leviy, SIMcard va Qarz uchun maydonlarini to'ldirish majburiy! (Mavjud bo'lmasa, 0 kiritib o'ting)");
                return;
            }

            if (debtTotal > 0 && qarzUchunNum < 50000) {
                alert(`⚠️ Sizda ${debtTotal.toLocaleString()} so'm qarzdorlik mavjud!\n"Qarz uchun" maydoniga kamida 50 000 so'm kiritishingiz shart.`);
                return;
            }

            let finalTotal = calculateTextTotal = calculateTotal();

            const reportData = {
                type: "daily_report",
                paynet: parseFloat(paynetVal) || 0,
                card: parseFloat(document.getElementById('card').value) || 0,
                leviy: parseFloat(leviyVal) || 0,
                simcard: parseInt(simcardVal) || 0,
                qarzdorlik: debtTotal,
                qarz_uchun: qarzUchunNum,
                terminal: parseFloat(terminalVal) || 0,
                berildi: parseFloat(document.getElementById('berildi').value) || 0,
                kunlik: parseFloat(kunlikVal) || 0,
                skidka: parseFloat(skidkaVal) || 0,
                xarajat: parseFloat(xarajatVal) || 0,
                total_final: finalTotal,
                comment: commentVal
            };

            tg.sendData(JSON.stringify(reportData));
        }

        window.onload = function() {
            loadParamsFromURL();
        };
    </script>
</body>
</html>
