<script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadHistory() {
            const container = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('my_card_history')) || [];

            if (history.length === 0) {
                container.innerHTML = '<div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 10px;">Hozircha tarix bo\'sh.</div>';
                return;
            }

            let html = '';
            history.forEach(item => {
                let formattedAmount = Number(item.amount).toLocaleString();
                let formattedFinal = Number(item.final_amount || item.amount * 1.03).toLocaleString();
                
                let statusClass = "status-kutilmoqda";
                let statusText = item.status || "Kutilmoqda";
                let borderColor = "#facc15";

                if (statusText === "Tasdiqlandi" || statusText.includes("Tasdiqlandi")) {
                    statusClass = "status-tasdiqlandi";
                    borderColor = "#4ade80";
                    statusText = "Tasdiqlandi ✅";
                } else if (statusText === "Rad etildi" || statusText.includes("Rad")) {
                    statusClass = "status-rad";
                    borderColor = "#f87171";
                    statusText = "Rad etildi ❌";
                } else {
                    statusClass = "status-kutilmoqda";
                    borderColor = "#facc15";
                    statusText = "Kutilmoqda ⏳";
                }

                html += `
                    <div class="history-card" style="border-left-color: ${borderColor};">
                        <div class="card-header-row">
                            <span>📅 ${item.date} ⏰ ${item.time}</span>
                            <span class="${statusClass}" style="font-weight: bold;">${statusText}</span>
                        </div>
                        <div class="card-number">💳 ${item.card_number}</div>
                        <div class="card-holder">👤 ${item.card_holder}</div>
                        <div class="card-amounts">💰 Asl: ${formattedAmount} so'm ➔ <span style="color:#ffffff;">+3%: ${formattedFinal} so'm</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // "Yangilash" tugmasi bosilganda botga so'rov ketadi
        function syncWithBot() {
            tg.sendData(JSON.stringify({ action: "sync_status" }));
            setTimeout(() => {
                loadHistory();
                alert("Tarix yangilandi!");
            }, 500);
        }

        function sendCardData() {
            let cardNumber = document.getElementById('cardNumber').value.trim();
            let cardHolder = document.getElementById('cardHolder').value.trim();
            let amountVal = document.getElementById('amount').value.trim();

            if (!cardNumber || !cardHolder || !amountVal) {
                alert("Barcha maydonlarni to'ldiring!");
                return;
            }

            let now = new Date();
            let dateStr = now.toLocaleDateString();
            let timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let cardData = {
                type: "card_transaction",
                card_number: cardNumber,
                card_holder: cardHolder,
                amount: parseFloat(amountVal),
                final_amount: parseFloat(amountVal) * 1.03,
                date: dateStr,
                time: timeStr,
                status: "Kutilmoqda"
            };

            let myHistory = JSON.parse(localStorage.getItem('my_card_history')) || [];
            myHistory.unshift(cardData);
            localStorage.setItem('my_card_history', JSON.stringify(myHistory));

            document.getElementById('cardNumber').value = '';
            document.getElementById('cardHolder').value = '';
            document.getElementById('amount').value = '';

            loadHistory();
            tg.sendData(JSON.stringify(cardData));
        }

        window.onload = function() {
            loadHistory();
        };
    </script>
