<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisobot va Tarix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2638;
            --text-color: #ffffff;
            --text-secondary: #9aa4bf;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --input-bg: #161c2a;
            --border-color: #2e384e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Форма ввода */
        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 24px;
        }

        /* Раздел истории */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 18px;
            font-weight: bold;
        }

        .btn-refresh {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .history-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent-yellow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-number {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-user {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .card-amount {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-green);
        }

        /* Статусы */
        .status-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .status-pending { color: var(--accent-yellow); }
        .status-approved { color: var(--accent-green); }
        .status-rejected { color: var(--accent-red); }

        .card-pending { border-left-color: var(--accent-yellow); }
        .card-approved { border-left-color: var(--accent-green); }
        .card-rejected { border-left-color: var(--accent-red); }
    </style>
</head>
<body>

<div class="container">

    <!-- ФОРМА С ПОЛЕМ ДЛЯ КАРТЫ -->
    <div class="form-group">
        <input type="text" id="cardNumber" class="form-input" placeholder="Karta raqami (masalan: 8600 ...)">
    </div>
    <div class="form-group">
        <input type="text" id="userName" class="form-input" placeholder="Ism Familiya">
    </div>
    <div class="form-group">
        <input type="number" id="amount" class="form-input" placeholder="Summani kiriting (so'm)">
    </div>
    <button class="btn-submit" onclick="sendData()">Guruhga yuborish</button>

    <!-- ИСТОРИЯ -->
    <div class="history-header">
        <span class="history-title">Mening Tarixim</span>
        <button class="btn-refresh" onclick="loadHistory()">🔄 Yangilash</button>
    </div>

    <div id="historyContainer">
        <!-- Записи загружаются динамически -->
    </div>

</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const API_URL = window.location.origin;

    // Загрузка истории
    async function loadHistory() {
        try {
            const response = await fetch(`${API_URL}/api/history`);
            const data = await response.json();
            
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<div style="color: var(--text-secondary); text-align: center;">Tarix mavjud emas</div>';
                return;
            }

            data.forEach(item => {
                let statusText = 'Kutilmoqda ⏳';
                let statusClass = 'status-pending';
                let cardClass = 'card-pending';

                if (item.status === 'approved' || item.status === 'Tasdiqlandi') {
                    statusText = 'Tasdiqlandi ✅';
                    statusClass = 'status-approved';
                    cardClass = 'card-approved';
                } else if (item.status === 'rejected' || item.status === 'Rad etildi') {
                    statusText = 'Rad etildi ❌';
                    statusClass = 'status-rejected';
                    cardClass = 'card-rejected';
                }

                const cardHtml = `
                    <div class="history-card ${cardClass}">
                        <div class="card-header">
                            <span>📅 ${item.date \vert{}\vert{} ''} ⏰${item.time || ''}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="card-number">💳 ${item.card_number || '---'}</div>
