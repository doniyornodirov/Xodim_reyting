<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xodim Hisobot Formasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #f4f6f9); color: var(--tg-theme-text-color, #000); }
        .card { background: var(--tg-theme-secondary-bg-color, #fff); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #2481cc; }
        button { width: 100%; padding: 14px; background-color: #2481cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background-color: #1b659d; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hisobot topshirish</h2>
        <form id="reportForm">
            <div class="form-group">
                <label>16 xonali karta raqami:</label>
                <input type="text" id="card" maxlength="16" placeholder="8600123456789012" required>
            </div>
            <div class="form-group">
                <label>Ism va Familiya:</label>
                <input type="text" id="fullname" placeholder="Doniyor Nodirov" required>
            </div>
            <div class="form-group">
                <label>Summa (so'm):</label>
                <input type="number" id="amount" placeholder="1000000" required>
            </div>
            <button type="submit">Guruhga yuborish</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById("reportForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const card = document.getElementById("card").value.trim();
            const fullname = document.getElementById("fullname").value.trim();
            const amount = parseFloat(document.getElementById("amount").value);

            if (card.length !== 16 || isNaN(card)) {
                alert("Karta raqami 16 ta raqamdan iborat bo'lishi shart!");
                return;
            }

            const data = {
                card: card,
                fullname: fullname,
                amount: amount,
                user_id: tg.initDataUnsafe?.user?.id || 0
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
