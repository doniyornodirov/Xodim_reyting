<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta To'ldirish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .warning {
            background-color: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #ffc107;
            margin-bottom: 20px;
        }
        .form-group {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #121824;
            border: 1px solid #2a3447;
            border-radius: 8px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Karta To'ldirish</h2>
        <div class="warning">
            ⚠️ Sizning birgina e'tiborsizligingiz, sizni moliyaviy qiyinchilikka solib qo'yadi!
        </div>

        <div class="form-group">
            <label>16 xonali karta raqami:</label>
            <input type="text" id="cardNumber" placeholder="8600 0000 0000 0000" maxlength="19">

            <label>Karta egasi:</label>
            <input type="text" id="cardHolder" placeholder="Ism Familiya">

            <label>Summa (so'm):</label>
            <input type="number" id="amount" placeholder="1 000 000">

            <button class="btn-submit" onclick="sendCardData()">Guruhga yuborish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendCardData() {
            let cardNumber = document.getElementById('cardNumber').value.trim();
            let cardHolder = document.getElementById('cardHolder').value.trim();
            let amount = document.getElementById('amount').value.trim();

            if (!cardNumber || !cardHolder || !amount) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }

            let entryId = Date.now();
            let now = new Date();
            let dateStr = now.toLocaleDateString();
            let timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let cardData = {
                type: "card_transaction",
                id: entryId,
                card_number: cardNumber,
                card_holder: cardHolder,
                amount: parseFloat(amount),
                final_amount: parseFloat(amount) * 1.03, // +3% qo'shilgan summa
                date: dateStr,
                time: timeStr,
                status: "Kutilmoqda"
            };

            // Brauzer xotirasiga vaqtincha saqlash
            let myHistory = JSON.parse(localStorage.getItem('my_card_history')) || [];
            myHistory.unshift(cardData);
            localStorage.setItem('my_card_history', JSON.stringify(myHistory));

            // Botga yuborish
            tg.sendData(JSON.stringify(cardData));
            
            alert("Karta ma'lumotlari muvaffaqiyatli yuborildi!");
            document.getElementById('cardNumber').value = '';
            document.getElementById('cardHolder').value = '';
            document.getElementById('amount').value = '';
        }
    </script>
</body>
</html>
