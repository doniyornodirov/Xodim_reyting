<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berilgan Summalar Tarixi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #121824;
            border: 1px solid #2a3447;
            border-radius: 8px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .history-card {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 4px solid #4caf50;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .amount {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .comment {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .status {
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Berilgan Summani Kiritish</h2>
        <div class="form-group">
            <input type="text" id="employeeName" placeholder="Xodimning ismi" value="">
            <input type="number" id="amount" placeholder="Summani kiriting (so'm)">
            <textarea id="comment" placeholder="Izoh yozing..." rows="2"></textarea>
            <button class="btn-submit" onclick="submitAmount()">Yuborish</button>
        </div>

        <h2>Mening Tarixatim</h2>
        <div id="myHistoryList">
            Yuklanmoqda...
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Telegram foydalanuvchi nomini avtomatik qo'yish
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('employeeName').value = tg.initDataUnsafe.user.first_name || "Xodim";
        } else {
            document.getElementById('employeeName').value = "Doni";
        }

        function submitAmount() {
            let employeeName = document.getElementById('employeeName').value.trim();
            let enteredAmount = document.getElementById('amount').value.trim();
            let enteredComment = document.getElementById('comment').value.trim() || "Izoh yo'q";

            if (!enteredAmount || isNaN(enteredAmount)) {
                alert("Iltimos, to'g'ri summa kiriting!");
                return;
            }

            let newEntry = {
                id: Date.now(),
                employee: employeeName,
                amount: enteredAmount,
                comment: enteredComment,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                status: "Kutilmoqda"
            };

            // Rahbar paneli uchun umumiy xotiraga saqlash
            let adminHistory = JSON.parse(localStorage.getItem('admin_given_history')) || [];
            adminHistory.unshift(newEntry);
            localStorage.setItem('admin_given_history', JSON.stringify(adminHistory));

            // Xodimning shaxsiy tarixiga saqlash
            let myHistory = JSON.parse(localStorage.getItem('my_given_history')) || [];
            myHistory.unshift(newEntry);
            localStorage.setItem('my_given_history', JSON.stringify(myHistory));

            // Botga ma'lumotni yuborish
            tg.sendData(JSON.stringify({
                type: "given_amount",
                amount: parseFloat(enteredAmount),
                comment: enteredComment
            }));

            document.getElementById('amount').value = '';
            document.getElementById('comment').value = '';
            loadMyHistory();
            alert("Muvaffaqiyatli yuborildi!");
        }

        function loadMyHistory() {
            const container = document.getElementById('myHistoryList');
            let items = JSON.parse(localStorage.getItem('my_given_history')) || [];

            if (items.length === 0) {
                container.innerHTML = '<div class="history-card"><div class="comment">Hozircha tarix yo\'q.</div></div>';
                return;
            }

            let html = '';
            items.forEach(item => {
                let formattedAmount = Number(item.amount).toLocaleString('en-US').replace(/,/g, ' ');
                html += `
                    <div class="history-card">
                        <div class="card-header">
                            <span>📅 ${item.date} ⏰ ${item.time}</span>
                            <span class="status">${item.status}</span>
                        </div>
                        <div class="amount">${formattedAmount} so'm</div>
                        <div class="comment"><b>Izoh:</b> ${item.comment}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        loadMyHistory();
    </script>
</body>
</html>
