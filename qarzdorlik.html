<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarzdorlik Boshqaruvi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            text-align: center;
            color: #e5b352;
            margin-bottom: 20px;
        }
        .form-group {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #121824;
            border: 1px solid #2a3447;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 12px;
        }
        .btn-save {
            width: 100%;
            padding: 14px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-save:active {
            background-color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💸 Xodim Qarzdorligini Belgilash</h2>
        
        <div class="form-group">
            <label>Xodim Telegram ID (user_id):</label>
            <input type="number" id="empUserId" placeholder="Masalan: 123456789">

            <label>Qarzdorlik summasi (so'm):</label>
            <input type="number" id="empDebt" placeholder="0">

            <button class="btn-save" onclick="saveDebt()">💾 Saqlash</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function saveDebt() {
            let userId = document.getElementById('empUserId').value;
            let debtVal = document.getElementById('empDebt').value;

            if (!userId) {
                alert("Iltimos, xodim Telegram ID raqamini kiriting!");
                return;
            }

            const sendPayload = {
                action: "update_debt",
                user_id: parseInt(userId),
                debt: parseFloat(debtVal) || 0
            };

            tg.sendData(JSON.stringify(sendPayload));
        }
    </script>
</body>
</html>
