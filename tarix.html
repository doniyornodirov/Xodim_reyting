<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xodimlardan Olingan Summalar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .history-card {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 4px solid #ffc107;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .employee {
            font-size: 16px;
            font-weight: bold;
            color: #4caf50;
        }
        .date-time {
            font-size: 12px;
            color: #94a3b8;
        }
        .amount {
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .comment {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-success {
            background-color: #4caf50;
            color: white;
        }
        .btn-danger {
            background-color: #1e2636;
            color: #ff3b30;
            border: 1px solid #ff3b30;
        }
        .status-badge {
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .status-ok { background-color: rgba(76, 175, 80, 0.2); color: #4caf50; width: 100%; box-sizing: border-box; }
        .status-no { background-color: rgba(255, 59, 48, 0.2); color: #ff3b30; width: 100%; box-sizing: border-box; }
        .empty-text {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xodimlardan Olingan Summalar</h2>
        <div id="historyList">
            Yuklanmoqda...
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadHistory() {
            const container = document.getElementById('historyList');
            
            let items = JSON.parse(localStorage.getItem('admin_given_history')) || [];

            // Eski namunali ma'lumotlarni tozalash (Doniyor 2 va Samandar larni olib tashlaydi)
            items = items.filter(item => item.employee !== "Doniyor 2" && item.employee !== "Samandar");
            localStorage.setItem('admin_given_history', JSON.stringify(items));

            if (items.length === 0) {
                container.innerHTML = '<div class="history-card"><div class="empty-text">Hozircha olingan summalar tarixi yo\'q.</div></div>';
                return;
            }

            let html = '';
            items.forEach((item, index) => {
                let statusHtml = '';
                if (!item.status || item.status === "Kutilmoqda") {
                    statusHtml = `
                        <div class="buttons">
                            <button class="btn btn-success" onclick="updateStatus(${index}, 'Olindi')">Olindi</button>
                            <button class="btn btn-danger" onclick="updateStatus(${index}, 'Rad etildi')">Rad etildi</button>
                        </div>
                    `;
                } else if (item.status === "Olindi") {
                    statusHtml = `<div class="status-badge status-ok">Olindi ✅</div>`;
                } else {
                    statusHtml = `<div class="status-badge status-no">Rad etildi ❌</div>`;
                }

                let formattedAmount = Number(item.amount).toLocaleString('en-US').replace(/,/g, ' ');

                html += `
                    <div class="history-card">
                        <div class="card-header">
                            <div class="employee">Xodim: ${item.employee}</div>
                            <div class="date-time">${item.date || ''} ${item.time || ''}</div>
                        </div>
                        <div class="amount">${formattedAmount} so'm</div>
                        <div class="comment"><b>Izoh:</b> ${item.comment || 'Izoh yo\'q'}</div>
                        ${statusHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStatus(index, newStatus) {
            let items = JSON.parse(localStorage.getItem('admin_given_history')) || [];
            if (items[index]) {
                items[index].status = newStatus;
                localStorage.setItem('admin_given_history', JSON.stringify(items));
                
                tg.sendData(JSON.stringify({
                    action: "update_status",
                    id: items[index].id,
                    status: newStatus
                }));
            }
            loadHistory();
        }

        loadHistory();
        // Har 2 sekundda yangilab turish
        setInterval(loadHistory, 2000);
    </script>
</body>
</html>
