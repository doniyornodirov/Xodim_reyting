<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olingan Summalar Tarixi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .item {
            margin-bottom: 6px;
            font-size: 14px;
        }
        .status-ok { color: #4caf50; font-weight: bold; }
        .status-no { color: #f44336; font-weight: bold; }
        .status-wait { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xodimlardan Olingan Summalar</h2>
        <div id="historyList">Yuklanmoqda...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Bu qism bot orqali ma'lumot olib kelinishi uchun tayyorlandi
        document.getElementById('historyList').innerHTML = '<div class="card"><div class="item">Ma\'lumotlar bot orqali yangilanadi.</div></div>';
    </script>
</body>
</html>
