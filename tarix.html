<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xodimlardan Olingan Summalar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .history-card {
            background-color: #1e2636;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 4px solid #ffc107;
        }
        .employee {
            font-size: 17px;
            font-weight: bold;
            color: #4caf50;
            margin-bottom: 6px;
        }
        .details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .amount {
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
        }
        .date-time {
            font-size: 13px;
            color: #94a3b8;
        }
        .comment {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-success {
            background-color: #4caf50;
            color: white;
        }
        .btn-danger {
            background-color: #2a3447;
            color: #ff3b30;
            border: 1px solid #ff3b30;
        }
        .status-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .status-ok { background-color: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .status-no { background-color: rgba(255, 59, 48, 0.2); color: #ff3b30; }
        .status-wait { background-color: rgba(255, 193, 7, 0.2); color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xodimlardan Olingan Summalar</h2>
        <div id="historyList">
            Yuklanmoqda...
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // LocalStorage yoki vaqtinchalik xotiradan ma'lumotlarni olish
        function renderAdminHistory() {
            const container = document.getElementById('historyList');
            
            // Namuna ma'lumotlar va xodim kiritganlar
            let items = JSON.parse(localStorage.getItem('admin_given_history')) || [
                { id: 1, employee: "Doniyor 2", amount: "1 000 000", date: "11.10.2026", time: "11:15", comment: "O'zingizga berdim", status: "Kutilmoqda 📌" },
                { id: 2, employee: "Samandar", amount: "10 000 000", date: "10.10.2026", time: "15:45", comment: "O'zingizga berdim", status: "Kutilmoqda 📌" }
            ];

            if (items.length === 0) {
                container.innerHTML = '<div class="history-card"><div class="comment">Hozircha arizalar yo\'q.</div></div>';
                return;
            }

            let html = '';
            items.forEach((item, index) => {
                let statusHtml = '';
                if (item.status.includes("Kutilmoqda") || !item.status.includes("✅") && !item.status.includes("❌")) {
                    statusHtml = `
                        <div class="buttons">
                            <button class="btn btn-success" onclick="updateStatus(${index}, 'Olindi ✅')">Olindi</button>
                            <button class="btn btn-danger" onclick="updateStatus(${index}, 'Rad etildi ❌')">Rad etildi</button>
                        </div>
                    `;
                } else if (item.status.includes("✅")) {
                    statusHtml = `<div class="status-badge status-ok">Holat: Olindi ✅</div>`;
                } else {
                    statusHtml = `<div class="status-badge status-no">Holat: Rad etildi ❌</div>`;
                }

                html += `
                    <div class="history-card">
                        <div class="employee">Xodim: ${item.employee}</div>
                        <div class="details">
                            <div class="amount">${item.amount} so'm</div>
                            <div class="date-time">${item.date} ${item.time}</div>
                        </div>
                        <div class="comment"><b>Izoh:</b> ${item.comment || 'Izoh yo\'q'}</div>
                        ${statusHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStatus(index, newStatus) {
            let items = JSON.parse(localStorage.getItem('admin_given_history')) || [];
            if (items[index]) {
                items[index].status = newStatus;
                localStorage.setItem('admin_given_history', JSON.stringify(items));
                
                // Botga ma'lumot yuborish (agar kerak bo'lsa)
                tg.sendData(JSON.stringify({
                    action: "update_status",
                    id: items[index].id,
                    status: newStatus
                }));
            }
            renderAdminHistory();
        }

        renderAdminHistory();
    </script>
</body>
</html>
